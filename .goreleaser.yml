# .goreleaser.yml for clipman
# https://goreleaser.com/customization/

version: 2

project_name: clipman

before:
  hooks:
    - go mod tidy
    - gofmt -w src/

builds:
  - main: ./src/main.go
    binary: clipman
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 CGO cross is still fragile; enable when ready
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
      - Merge pull request
      - Merge branch

release:
  draft: true
  replace_existing_draft: true
  mode: replace
  header: |
    ## Clipman {{ .Tag }}

    > A clipboard manager written in Go.

  footer: |
    ## Thanks!

    For full installation instructions see the [README](https://github.com/benbrackenbury/clipman#readme).

# For advanced CGO cross-compilation (especially linux/arm64 on amd64 runners),
# you can later switch specific builds to use:
#   builder: cgo
#   or the built-in zig / docker cross images provided by goreleaser.
# Start with the config above — it already produces high-quality macOS + Linux-amd64 + Windows releases.
