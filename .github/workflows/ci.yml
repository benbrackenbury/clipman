name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt per AGENTS.md)
        run: |
          DIFF=$(gofmt -l -d src/)
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            echo ""
            echo "Formatting issues detected. Run 'gofmt -w src/' locally and commit."
            exit 1
          fi
          echo "Formatting OK"

      - name: Run go vet (per AGENTS.md)
        run: go vet ./src/...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only -- go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "go.mod tidy OK"

  build-and-test:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build (per AGENTS.md)
        run: go build ./src/main.go

      - name: Test (per AGENTS.md)
        run: go test ./src/... -race

  build-platform:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary (CGO + clipboard for this OS)
        run: go build -o clipman${{ runner.os == 'Windows' && '.exe' || '' }} ./src/main.go

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipman-${{ matrix.os }}
          path: clipman${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7
